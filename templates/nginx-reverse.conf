# TrustTunnel 伪装静态站点 Nginx 配置 (配合 TrustTunnel 内置 [reverse_proxy] 使用)
# TrustTunnel 监听 0.0.0.0:443 (支持 HTTP/2 + HTTP/3 QUIC 隧道与 TLS ClientRandom 校验)
# 所有普通浏览器访问 (GET /...) 由 TrustTunnel 自动反代至本 Nginx (127.0.0.1:8080)

server {
    listen 127.0.0.1:8080 default_server;
    server_name _;

    root {{CAMOUFLAGE_ROOT}};
    index index.html;

    # 隐藏后端版本号，增强伪装真实度
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=3600";

    location / {
        try_files $uri $uri/ /index.html;
    }
}
