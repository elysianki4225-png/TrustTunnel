# TrustTunnel 前置 Nginx Stream (SNI 四层分流) + 伪装站点配置模板
# 优势：四层透传 TLS 握手，100% 保留 TrustTunnel 的 TLS ClientRandom 混淆校验与 HTTP/2 多路复用

stream {
    map $ssl_preread_server_name $backend_pool {
        {{VPN_HOSTNAME}}    trusttunnel_backend;
        default             web_camouflage_https;
    }

    upstream trusttunnel_backend {
        server 127.0.0.1:{{TT_INTERNAL_PORT}};
    }

    upstream web_camouflage_https {
        server 127.0.0.1:8444;
    }

    server {
        listen 443 reuseport;
        listen [::]:443 reuseport;
        ssl_preread on;
        proxy_pass $backend_pool;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 127.0.0.1:8444 ssl http2;
        server_name _;

        ssl_certificate     {{CERT_PATH}};
        ssl_certificate_key {{KEY_PATH}};
        ssl_protocols       TLSv1.2 TLSv1.3;

        root {{CAMOUFLAGE_ROOT}};
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
